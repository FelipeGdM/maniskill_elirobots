name: Criar e publicar imagem Docker

on:
  push:
    branches: ['main']  # Ou 'master', 'release', etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # (NOVO) Configura o Buildx com suporte a cache
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags, labels) para o Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build e push da imagem Docker
        id: push
        uses: docker/build-push-action@v5
        with:
          file: .devcontainer/gpu-cuda/Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # (NOVO) Habilita cache usando o repositório de cache do GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
