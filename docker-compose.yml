services:
  # Serviço principal onde você vai desenvolver
  # app:
  #  # build: .  # Se você usar um Dockerfile personalizado, descomente esta linha
  #  image: mcr.microsoft.com/devcontainers/python:3.12  # Ou a imagem base que preferir
  #  volumes:
  #    - ..:/workspace:cached  # Monta a pasta do projeto dentro do container
  #  command: sleep infinity   # Mantém o container rodando em segundo plano
  #  # ports:
  #  #   - "3000:3000"        # Mapeia portas se necessário (opcional)

  # Serviço de banco de dados, por exemplo
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: optuna
    ports:
      - "5432:5432" # Mapeia a porta do banco (opcional)
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
